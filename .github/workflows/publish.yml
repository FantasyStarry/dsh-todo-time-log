# 发布到 npm
#
# 认证现状（2026-11，重要）：
#   npm 已限制 bypass-2FA token 做「直接发布」（会报 EOTP），2027-01 起完全移除。
#   自动化发布的正确姿势：
#     首次建包 → npm stage publish（token 提交，不需要 2FA）→ npmjs.com 点 Approve（2FA）
#     日常发布 → Trusted Publisher（OIDC）+ npm publish（或同样走 stage + Approve）
#
# 触发：
#   - push tag v*.*.*  → 校验 + 全量测试 + npm publish --provenance（OIDC）+ GitHub Release
#   - workflow_dispatch → mode：
#       dry-run（默认）→ 只做 npm publish --dry-run
#       stage          → npm stage publish 提交待审批（可创建新包，用 NPM_TOKEN；不需 2FA）
#       publish        → OIDC 直接发布（需先在 npmjs.com 配好 Trusted Publisher）
#
# 详见 docs/publishing.md
name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run=预演 / stage=提交待审批（首次建包选这个）/ publish=OIDC 直接发布"
        type: choice
        options:
          - dry-run
          - stage
          - publish
        default: dry-run

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm 可信发布（OIDC）/ provenance 签名

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 校验并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（OIDC 可信发布需 npm ≥ 11.5.1）
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 升级 npm（staged publishing 需要 ≥ 11.15）
        if: inputs.mode == 'stage'
        run: npm install -g npm@latest && npm --version

      - name: 读取包名与版本，校验 tag 与版本一致
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag 为 $GITHUB_REF_NAME，但 package.json 版本为 $VERSION（应为 v$VERSION）"
            exit 1
          fi
          echo "发布目标：$NAME@$VERSION"

      - name: 检查该版本是否已在 npm 上
        id: exists
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} 已发布，跳过发布步骤"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 npm 令牌（存在 NPM_TOKEN secret 时用于 staged publish）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
            echo "::notice::检测到 NPM_TOKEN，使用令牌认证（仅用于 stage；直接 publish 需要 OIDC）"
          else
            echo "::notice::未设置 NPM_TOKEN，使用 OIDC 可信发布"
          fi

      - name: 语法检查
        run: npm run check

      - name: 单元 / 冒烟 / HTTP 测试
        run: npm test

      - name: 客户端静态审计
        run: npm run audit

      - name: 打包预演（确认发布内容）
        run: npm pack --dry-run

      - name: 发布到 npm（tag 触发，或 mode=publish；需 Trusted Publisher）
        if: steps.exists.outputs.value == 'false' && (github.event_name == 'push' || inputs.mode == 'publish')
        run: |
          if ! npm publish --provenance; then
            echo "::error::npm publish 失败。若报 EOTP（一次性密码），说明 npm 已禁止 bypass-2FA token 直接发布。"
            echo "::error::首次建包请改用 Actions → Run workflow → mode=stage，然后到 npmjs.com → 包 → Staged Packages → Approve（2FA）。"
            echo "::error::包已存在后，配置 Trusted Publisher（勾选允许 npm publish）并删除 NPM_TOKEN，tag 推送即可 OIDC 自动发布。"
            exit 1
          fi

      - name: 提交 npm 待审批（mode=stage，可创建新包）
        if: steps.exists.outputs.value == 'false' && inputs.mode == 'stage'
        run: |
          if ! npm stage publish; then
            echo "::error::npm stage publish 失败。检查 NPM_TOKEN 是否为 granular token（Packages 选 All packages，Read and write）。"
            exit 1
          fi
          npm stage list || true
          echo "::notice::已提交待审批：打开 https://www.npmjs.com/package/${{ steps.meta.outputs.name }} → Staged Packages → Approve（需 2FA）"

      - name: 发布预演（mode=dry-run）
        if: inputs.mode == 'dry-run'
        run: npm publish --dry-run

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
